name: CI

on:
  push:
    branches: [main]
    paths: ['governance-demo-bedrock/**']
  pull_request:
    branches: [main]
    paths: ['governance-demo-bedrock/**']

defaults:
  run:
    working-directory: governance-demo-bedrock

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt mypy boto3-stubs[dynamodb,s3,sns,cloudwatch,lambda,stepfunctions]
      - run: mypy lambdas/governance_engine/index.py --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest pytest-cov moto[dynamodb,s3,sns]
      - run: npm install -g aws-cdk
      - run: python -m pytest tests/ -v --cov=lambdas --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit
      - run: bandit -r lambdas/ -ll -ii

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install -g aws-cdk
      - run: npx cdk synth -c skip_cloudtrail=true --quiet
