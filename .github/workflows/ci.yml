name: CI

on:
  push:
    branches: [main]
    paths: ['governance-demo-bedrock/**']
  pull_request:
    branches: [main]
    paths: ['governance-demo-bedrock/**']

defaults:
  run:
    working-directory: governance-demo-bedrock

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: Lint core modules
        run: ruff check governance_constructs/ governance_bedrock_stack.py lambdas/governance_engine/index.py lambdas/governance_engine/api_router.py lambdas/governance_engine/pipeline_orchestrator.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: npm install -g aws-cdk
      - run: python -m pytest tests/test_governance_bedrock_stack.py -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit
      - name: Security scan (high-severity only)
        run: bandit -r lambdas/ -lll --skip B101,B105,B110,B603,B613

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install -g aws-cdk
      - run: npx cdk synth -c skip_cloudtrail=true --quiet
