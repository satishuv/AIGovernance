name: CI

on:
  push:
    branches: [main]
    paths: ['governance-demo-bedrock/**', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['governance-demo-bedrock/**', '.github/workflows/**']

defaults:
  run:
    working-directory: governance-demo-bedrock

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: Lint core modules
        run: ruff check governance_constructs/ governance_bedrock_stack.py lambdas/governance_engine/index.py lambdas/governance_engine/api_router.py lambdas/governance_engine/pipeline_orchestrator.py

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Type check core modules (advisory)
        run: mypy governance_constructs/ governance_bedrock_stack.py --ignore-missing-imports --no-strict-optional || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: npm install -g aws-cdk
      # The whole suite: security regressions (P0 fixes, delegation, durable
      # state, bindings), the 12 demo scenarios and the stack assertions.
      # The live AWS test skips unless LIVE_AWS is set.
      - run: python -m pytest tests -q
      - name: In-memory state inventory (P0-12)
        run: python scripts/inventory_in_memory_state.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit pip-audit detect-secrets
      - name: Internal identifier and secret scan (blocking)
        working-directory: .
        run: python scripts/pre_push_check.py --all
      - name: Static security scan (high-severity only)
        run: bandit -r lambdas/ -lll --skip B101,B105,B110,B603,B613
      - name: Dependency CVE scan (advisory)
        run: pip-audit -r requirements.txt || true
      - name: Secret scan (advisory)
        run: detect-secrets scan lambdas/ governance_constructs/ governance_bedrock_stack.py > /dev/null && echo "secret scan complete" || true

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install -g aws-cdk
      - run: npx cdk synth -c skip_cloudtrail=true --quiet
